name: Daily Digest

on:
  schedule:
    # GitHub cron is UTC and has no DST. Scheduled runs start late, often by hours
    # (13:00 UTC runs were landing at 16:00-19:40), so this is set early and off the
    # top of the hour, which is when the queue is busiest. 11:17 UTC = 4:17 AM PDT /
    # 3:17 AM PST, so the digest is there by the time she's up.
    - cron: "17 11 * * *"
  # Lets you run it on demand from the Actions tab to test.
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The paper pool and seen-list must survive between runs, otherwise every
      # morning starts cold and repeats the same papers. restore-keys lets today
      # pick up yesterday's cache even though the key is date-stamped.
      - name: Restore paper cache
        uses: actions/cache@v4
        with:
          path: |
            .paper_pool.json
            .seen_papers.json
          key: linalg-cache-${{ github.run_id }}
          restore-keys: linalg-cache-

      # Its own cache entry: adding a path to the one above would change that
      # cache's version and throw away the banked paper pool.
      - name: Restore Luma seen-events
        uses: actions/cache@v4
        with:
          path: .seen_events.json
          key: events-cache-${{ github.run_id }}
          restore-keys: events-cache-

      # Same reason as above: its own entry so neither existing cache is invalidated.
      - name: Restore seen-jobs
        uses: actions/cache@v4
        with:
          path: .seen_jobs.json
          key: jobs-cache-${{ github.run_id }}
          restore-keys: jobs-cache-

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HN_COUNT: "5"
          # Optional but strongly recommended — see the README. Without it the
          # bot shares a global anonymous quota and most requests get 429'd.
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python3 digest.py
