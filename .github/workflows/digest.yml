name: Daily Digest

on:
  schedule:
    # GitHub cron is UTC and has no DST. 13:00 UTC = 6:00 AM Pacific Daylight Time
    # (most of the year). During Pacific Standard Time (~Nov–Mar) this fires at 5:00 AM.
    # See the README for how to keep it at 6:00 AM year-round.
    - cron: "0 13 * * *"
  # Lets you run it on demand from the Actions tab to test.
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The paper pool and seen-list must survive between runs, otherwise every
      # morning starts cold and repeats the same papers. restore-keys lets today
      # pick up yesterday's cache even though the key is date-stamped.
      - name: Restore paper cache
        uses: actions/cache@v4
        with:
          path: |
            .paper_pool.json
            .seen_papers.json
          key: linalg-cache-${{ github.run_id }}
          restore-keys: linalg-cache-

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HN_COUNT: "5"
          # Optional but strongly recommended — see the README. Without it the
          # bot shares a global anonymous quota and most requests get 429'd.
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python3 digest.py
